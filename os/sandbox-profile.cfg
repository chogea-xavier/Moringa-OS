# Moringa OS Virtualized Sandbox Security Profile
# Author: Wrld Xavier | Wrld Tech

[sandbox]
engine = "bubblewrap-seccomp-v2"
rootfs_mode = "read-only-overlayfs"
ephemeral_tmpfs = true
unshare_all = true
die_with_parent = true

[resources]
default_memory_mb = 1024
max_memory_mb = 8192
cpu_quota_percent = 50
pids_max = 128

[network]
default_policy = "isolated"
allow_loopback_bridge = false
dns_leak_protection = true

[syscalls]
seccomp_profile = "/etc/moringa/seccomp-strict.bpf"
block_ptrace = true
block_kexec = true
block_mount = true
block_raw_sockets = true

[cross_platform_containment]
winbridge_isolated_prefix = true
darwinbridge_isolated_rootfs = true
clipboard_sharing = "prompt"
gpu_passthrough = "wayland-dmabuf-restricted"
